# Local development stack. NOT a production deployment.
#
#   docker compose -f infra/docker-compose.yml up -d --build
#
# All ports are bound to 127.0.0.1 so nothing is reachable from the local network.
# Credentials below are development-only defaults; override them via infra/.env.
name: kiroween-mobility

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-platform}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_postgres_password}
  POSTGRES_DB: ${POSTGRES_DB:-platform}

x-api-env: &api-env
  APP_ENV: development
  NODE_ENV: production
  PORT: '3000'
  LOG_LEVEL: info
  DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-dev_only_postgres_password}@postgres:5432/${POSTGRES_DB:-platform}
  REDIS_URL: redis://:${REDIS_PASSWORD:-dev_only_redis_password}@redis:6379/0
  STORAGE_ENDPOINT: http://storage:8333
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: platform-documents
  STORAGE_FORCE_PATH_STYLE: 'true'
  STORAGE_ACCESS_KEY_ID: dev-access-key
  STORAGE_SECRET_ACCESS_KEY: dev-secret-key-not-for-production
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  API_DOCS_ENABLED: 'true'
  # Development only: SMS codes are kept in memory, readable at /api/v1/dev/sms/messages.
  SMS_PROVIDER: dev

services:
  postgres:
    image: postgres:17-alpine
    environment: *db-env
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-dev_only_redis_password}', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-56379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-dev_only_redis_password}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible private object storage (SeaweedFS, Apache-2.0). Production uses a
  # managed S3-compatible service selected during Phase 23.
  storage:
    image: chrislusf/seaweedfs:4.54
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports: ['127.0.0.1:${STORAGE_HOST_PORT:-58333}:8333']
    volumes:
      - storage-data:/data
      - ./storage/s3-identities.dev.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 3s
      retries: 30

  storage-init:
    image: chrislusf/seaweedfs:4.54
    depends_on:
      storage: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        for i in $$(seq 1 30); do
        echo 's3.bucket.list' | weed shell -master=storage:9333 >/dev/null 2>&1 && break; sleep 2; done;
        echo 's3.bucket.list' | weed shell -master=storage:9333 | grep -q platform-documents ||
        echo 's3.bucket.create -name platform-documents' | weed shell -master=storage:9333
    restart: 'no'

  migrate:
    build: { context: ../backend, target: migrator }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ../backend, target: runtime }
    environment: *api-env
    ports: ['127.0.0.1:${API_HOST_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  storage-data:
